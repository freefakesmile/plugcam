name: release

# Push a tag like v0.3.0 (same as the version in tauri.conf.json and package.json): builds
# plugcam_dec.dll, the installer and the portable zip and publishes them as a release with the
# notes from docs/releases/<tag>.md.
#
# This fork's builds do not update themselves (see ENABLED in src-tauri/src/app/updates.rs), so
# nothing is signed for the updater and no latest.json is made: no secrets are needed.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  # plugcam_dec.dll: FFmpeg's H.264 decoder on Direct3D 12, cross-built with mingw-w64 (see
  # docs/decoder.md). In the same Ubuntu as the machine it was developed on, for the same headers.
  decoder:
    runs-on: ubuntu-latest
    container: ubuntu:26.04
    steps:
      - name: Toolchain
        run: |
          apt-get update -qq
          DEBIAN_FRONTEND=noninteractive apt-get install -y -qq build-essential gcc-mingw-w64-x86-64 pkg-config xz-utils curl ca-certificates git

      - uses: actions/checkout@v7

      # FFmpeg takes minutes to build and only changes with build.sh.
      - uses: actions/cache@v6
        with:
          path: decoder/build/prefix
          key: ffmpeg-ubuntu-26.04-${{ hashFiles('decoder/build.sh') }}

      - name: Build plugcam_dec.dll
        run: sh decoder/build.sh

      - uses: actions/upload-artifact@v7
        with:
          name: plugcam-decoder
          path: decoder/out/

  installer:
    needs: decoder
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Build plugcam_cam.dll (x64, Win32)
        run: ./scripts/vcam-build.ps1

      - uses: actions/download-artifact@v8
        with:
          name: plugcam-decoder
          path: decoder/out

      # tauri-build checks that the bundled resources exist, so tests need them too.
      - name: Stage adb, the camera DLLs and the decoder
        run: ./scripts/stage-resources.ps1 -Download -RequireDecoder

      - name: Tests
        working-directory: src-tauri
        run: cargo test --release

      - name: Installer and portable zip
        run: |
          $tag = "${{ github.ref_name }}"
          $version = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          if ("v$version" -ne $tag) { throw "tag $tag does not match version $version in tauri.conf.json" }
          pnpm install --frozen-lockfile
          pnpm tauri build
          ./scripts/portable.ps1

      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.ref_name }}"
          $bundle = "src-tauri/target/release/bundle"
          $files = @(
            (Get-ChildItem "$bundle/nsis/*-setup.exe" | Select-Object -First 1).FullName
            (Get-ChildItem "$bundle/portable/*-portable.zip" | Select-Object -First 1).FullName
          )
          foreach ($f in @($files)) {
            $hash = (Get-FileHash $f -Algorithm SHA256).Hash.ToLower()
            "$hash  $(Split-Path $f -Leaf)" | Out-File -Encoding ascii "$f.sha256"
            $files += "$f.sha256"
          }
          $notes = "docs/releases/$tag.md"
          if (gh release view $tag 2>$null) {
            # Made by hand: keep the files it was tested with.
            Write-Output "Release $tag already exists; leaving its files alone."
          } elseif (Test-Path $notes) {
            gh release create $tag @files --title "Plugcam $tag" --notes-file $notes
          } else {
            gh release create $tag @files --title "Plugcam $tag" --generate-notes
          }
